[project]
name = "sleep-diary"
version = "0.2.0"
description = "Sleep diary: log your night sleep and check them compared to a goal."
readme = "README.md"
license = "MIT" 
authors = [
    { name = "kanoka sakurai", email = "kanokanosakusaku@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["sleep", "record", "goal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
sleep-diary = "sleep_diary:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.urls]
Homepage = "https://github.com/mii0829/sleep-diary"
Issues = "https://github.com/mii0829/sleep-diary/issues"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]